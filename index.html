<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AnimeRealm</title>
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <script src="assets/javascript/common.js" defer></script>
    <script src="assets/javascript/login.js" defer></script>
</head>
<body class="auth-body auth-login">
    <button id="theme-toggle" class="btn-icon theme-float" aria-label="Toggle light/dark theme"></button>
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-brand">
                <img src="assets/images/hat.png" alt="AnimeRealm">
                <span>AnimeRealm</span>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-sub">Sign in to continue your journey</p>
            <div class="auth-form">
                <label for="username">Username</label>
                <input type="text" id="username" required autocomplete="username">
                <label for="password">Password</label>
                <input type="password" id="password" required autocomplete="current-password">
                <button id="login" class="btn btn-primary btn-lg auth-submit">Login</button>
            </div>
            <p class="auth-switch">New to AnimeRealm? <a href="pages/registration.html">Create an account</a></p>
        </div>
    </div>
    <div id="notification" class="notification"></div>
</body>
</html>
